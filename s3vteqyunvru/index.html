<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>VBOX kernel</title>
<style>:root { --text: #1d1d1f; --muted: #6e6e73; --line: #e5e5ea; --soft: #f5f5f7; --accent: #c23b25; --background: #fff; color-scheme: light dark; }
@media (prefers-color-scheme: dark) { :root { --text: #f5f5f7; --muted: #98989d; --line: #38383a; --soft: #1c1c1e; --accent: #ff9e8a; --background: #000; } }
* { box-sizing: border-box; }
body { margin: 0; background: var(--background); color: var(--text); font: 17px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
main { max-width: 700px; margin: 0 auto; padding: 56px 24px; }
h1, h2, h3, h4, h5, h6 { line-height: 1.25; margin: 1.4em 0 0.5em; }
h1 { font-size: 2em; letter-spacing: -0.02em; margin-top: 0; }
h2 { font-size: 1.5em; letter-spacing: -0.01em; }
h3 { font-size: 1.2em; }
p, ul, ol, blockquote, figure, pre, .table { margin: 0 0 1em; }
a { color: var(--accent); text-underline-offset: 2px; }
ul, ol { padding-left: 1.4em; }
li::marker { color: var(--accent); }
li.task { list-style: none; margin-left: -1.4em; }
li.task input { accent-color: var(--accent); margin-right: 0.4em; }
blockquote { margin-left: 0; padding-left: 1em; border-left: 3px solid var(--accent); color: var(--muted); }
code { font: 0.9em ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; background: var(--soft); padding: 0.1em 0.35em; border-radius: 4px; }
pre { background: var(--soft); padding: 14px 16px; border-radius: 10px; overflow-x: auto; }
pre code { background: none; padding: 0; }
hr { border: 0; border-top: 1px solid var(--line); margin: 2em 0; }
figure img { max-width: 100%; height: auto; border-radius: 10px; display: block; }
.tag { color: var(--accent); }
.table { overflow-x: auto; }
table { border-collapse: separate; border-spacing: 0; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
th, td { padding: 8px 14px; border-bottom: 1px solid var(--line); border-right: 1px solid var(--line); text-align: left; }
th { background: var(--soft); font-weight: 600; }
tr > :last-child { border-right: 0; }
tbody tr:last-child td { border-bottom: 0; }</style>
</head>
<body>
<main>
<h2>VBOX kernel</h2>
<pre><code>sudo apt-get install linux-headers-`uname -r`
sudo dpkg-reconfigure virtualbox-dkms  
sudo modprobe vboxdrv</code></pre>
</main>
</body>
</html>
